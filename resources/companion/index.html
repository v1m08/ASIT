<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#12141a" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<title>ASIT</title>
<style>
  :root {
    --bg: #12141a; --raised: #1a1d26; --hover: #22262f; --border: #2c3038;
    --text: #e6e8ee; --dim: #9aa0ad; --accent: #7aa2f7; --accent-dim: #3d59a1;
    --danger: #f7768e; --ok: #9ece6a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 0;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px;
  }
  header .logo { font-weight: 700; font-size: 1.15rem; color: var(--accent); }
  header .conn { margin-left: auto; font-size: 0.72rem; color: var(--dim); }
  header .conn.ok::before { content: '● '; color: var(--ok); }
  header .conn.off::before { content: '● '; color: var(--danger); }
  main { flex: 1; overflow-y: auto; padding: 4px 14px 90px; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--raised); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--dim);
    font: inherit; font-size: 0.72rem; padding: 10px 0 8px; cursor: pointer;
  }
  nav button .ic { display: block; font-size: 1.25rem; margin-bottom: 2px; }
  nav button.active { color: var(--accent); }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 14px 2px 8px; }
  .card {
    background: var(--raised); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .dim { color: var(--dim); font-size: 0.8rem; }
  .strike { text-decoration: line-through; color: var(--dim); }
  /* Links inside a to-do are tappable; big enough to hit with a thumb. */
  .tlink { color: var(--accent); text-decoration: underline; word-break: break-word; }
  input[type='text'], textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font: inherit; font-size: 16px; /* 16px stops iOS zoom */
  }
  textarea { resize: none; min-height: 84px; }
  .btn {
    background: var(--accent-dim); color: var(--text); border: none;
    border-radius: 10px; padding: 12px 18px; font: inherit; font-size: 0.95rem;
    cursor: pointer; touch-action: manipulation;
  }
  .btn:active { background: var(--accent); color: #10121a; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--dim); }
  .btn-sm { padding: 8px 12px; font-size: 0.82rem; }
  .check {
    width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border);
    background: none; flex-shrink: 0; cursor: pointer;
  }
  .check.done { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
  .badge { font-size: 0.7rem; border: 1px solid var(--border); border-radius: 99px; padding: 2px 8px; color: var(--dim); white-space: nowrap; }
  .badge-danger { color: var(--danger); border-color: var(--danger); }
  .q-card { padding: 18px 16px; }
  .q-task { font-size: 0.72rem; color: var(--dim); margin-bottom: 8px; }
  .q-text { font-size: 1.05rem; line-height: 1.5; margin-bottom: 14px; user-select: text; }
  .q-answer { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; line-height: 1.5; user-select: text; white-space: pre-wrap; }
  .choice { display: block; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px; margin-bottom: 8px; font: inherit; font-size: 0.95rem; }
  .choice.correct { border-color: var(--ok); }
  .choice.wrong { border-color: var(--danger); }
  .grades { display: flex; gap: 8px; margin-top: 14px; }
  .grades .btn { flex: 1; padding: 12px 0; font-size: 0.85rem; }
  .g0 { background: #5c2231; } .g1 { background: #4d3a1f; } .g2 { background: var(--accent-dim); } .g3 { background: #2c4a26; }
  .empty { color: var(--dim); text-align: center; padding: 46px 20px; line-height: 1.6; }
  .chat-q { color: var(--accent); font-weight: 600; margin-bottom: 6px; }
  .chat-a { line-height: 1.55; white-space: pre-wrap; user-select: text; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent-dim); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pair { padding: 40px 26px; text-align: center; line-height: 1.7; }
  .toastbox { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 14px; right: 14px; z-index: 50; }
  .toastmsg { background: var(--raised); border: 1px solid var(--accent-dim); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; font-size: 0.85rem; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
</style>
</head>
<body>
  <div class="toastbox" id="toasts"></div>
  <div id="pair" hidden>
    <p style="font-size:2rem">🔗</p>
    <h1 style="margin:10px 0">Pair with ASIT</h1>
    <div id="pair-body"><p class="dim">Contacting your PC…</p></div>
  </div>
  <header id="hdr" hidden>
    <span class="logo">A</span><span style="font-weight:600">asit</span>
    <span class="conn off" id="conn">connecting…</span>
  </header>
  <main id="main" hidden></main>
  <nav id="nav" hidden>
    <button data-tab="todos"><span class="ic">☑</span>To-dos</button>
    <button data-tab="review"><span class="ic">🧠</span>Review</button>
    <button data-tab="agents"><span class="ic">🤖</span>Agents</button>
    <button data-tab="capture"><span class="ic">✎</span>Capture</button>
    <button data-tab="ask"><span class="ic">⚡</span>Ask</button>
  </nav>

<script>
(() => {
  // ---- pairing token: arrives once in the URL fragment, then lives in localStorage
  if (location.hash.length > 1) {
    localStorage.setItem('asit-token', location.hash.slice(1))
    history.replaceState(null, '', location.pathname)
  }
  const token = () => localStorage.getItem('asit-token') || ''

  // Register the offline shell FIRST — this used to live after the pairing
  // gate's early return, so a fresh home-screen install cached nothing and
  // the app simply would not open with the PC off.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker
      .register('/sw.js')
      .then((reg) => { reg.update().catch(() => {}) })
      .catch((err) => { console.warn('offline shell unavailable:', err && err.message) })
    // Confirm it ONCE, so you find out the app works offline here rather than
    // the first time your PC is off. `toast` is a hoisted declaration.
    navigator.serviceWorker.ready
      .then(() => {
        if (localStorage.getItem('asit-offline-ready')) return
        localStorage.setItem('asit-offline-ready', '1')
        setTimeout(() => toast('Offline ready — opens without your PC'), 1500)
      })
      .catch(() => {})
  }

  // Unpaired (e.g. a fresh home-screen install — iOS gives it storage separate
  // from Safari's): request a pairing code and wait for approval on the PC.
  if (!token()) {
    document.getElementById('pair').hidden = false
    const body = document.getElementById('pair-body')
    ;(async () => {
      try {
        const start = await fetch('/api/pair/start', { method: 'POST' })
        if (!start.ok) throw new Error((await start.json()).error || 'pairing unavailable')
        const { requestId, code } = await start.json()
        body.innerHTML = `
          <p class="dim" style="margin-bottom:14px">On your PC, open <b>Settings → 📱 Phone</b> and approve this code:</p>
          <p style="font-size:2.6rem;font-weight:700;letter-spacing:0.15em;color:var(--accent)">${code}</p>
          <p class="dim" style="margin-top:14px">Waiting for approval…</p>`
        const poll = setInterval(async () => {
          try {
            const r = await fetch('/api/pair/poll?rid=' + encodeURIComponent(requestId))
            if (r.status === 404) {
              clearInterval(poll)
              body.innerHTML = '<p class="dim">Request expired or was denied. Reload to try again.</p>'
              return
            }
            const j = await r.json()
            if (j.token) {
              clearInterval(poll)
              localStorage.setItem('asit-token', j.token)
              location.reload()
            }
          } catch { /* transient — keep polling */ }
        }, 2500)
      } catch (err) {
        body.innerHTML = '<p class="dim">Could not reach your PC (' + err.message + '). Is Tailscale connected and ASIT open? Reload to retry.</p>'
      }
    })()
    return
  }
  document.getElementById('hdr').hidden = false
  document.getElementById('main').hidden = false
  document.getElementById('nav').hidden = false

  const $ = (s) => document.querySelector(s)
  const main = $('#main')
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

  function toast(text) {
    const el = document.createElement('div')
    el.className = 'toastmsg'
    el.textContent = text
    $('#toasts').appendChild(el)
    setTimeout(() => el.remove(), 4000)
  }

  async function api(path, opts = {}) {
    // 12s timeout: a hung request must become a visible error, never a blank
    // screen — the user can't debug silence.
    const ctrl = new AbortController()
    const timer = setTimeout(() => ctrl.abort(), 12000)
    let res
    try {
      res = await fetch('/api/' + path, {
        ...opts,
        signal: ctrl.signal,
        headers: {
          'content-type': 'application/json',
          authorization: 'Bearer ' + token(),
          ...(opts.headers || {})
        }
      })
    } catch (err) {
      throw new Error(
        err.name === 'AbortError'
          ? 'Request timed out — the PC did not answer.'
          : 'Could not reach your PC (' + err.message + ')'
      )
    } finally {
      clearTimeout(timer)
    }
    if (res.status === 401) {
      localStorage.removeItem('asit-token')
      location.reload()
      throw new Error('unauthorized')
    }
    if (!res.ok) throw new Error('PC answered ' + res.status + ': ' + (await res.text()).slice(0, 200))
    return res.json()
  }

  // ---- Offline layer: last-good data is cached on the phone; changes made
  // while the PC is unreachable queue up and replay on reconnect. Your PC can
  // be OFF and you can still review due questions, tick to-dos, and capture.
  const cacheGet = (k) => { try { return JSON.parse(localStorage.getItem('asit-c-' + k) || 'null') } catch { return null } }
  const cacheSet = (k, data) => localStorage.setItem('asit-c-' + k, JSON.stringify({ at: Date.now(), data }))
  const qGet = () => { try { return JSON.parse(localStorage.getItem('asit-q') || '[]') } catch { return [] } }
  // Every op carries a unique id — the server dedupes, so a retry after a
  // lost response can never double-apply a grade.
  const qPush = (op) => localStorage.setItem('asit-q', JSON.stringify([...qGet(), { ...op, opId: Date.now() + '-' + Math.random().toString(36).slice(2, 10) }]))
  let offlineSince = null

  // Single-flight: many triggers (render, focus, online, WS) can request a
  // flush at once — they all share one round-trip. Only the ops actually sent
  // are removed, so anything queued mid-flight survives to the next flush.
  let flushInFlight = null
  function flushQueue() {
    if (flushInFlight) return flushInFlight
    const ops = qGet()
    if (ops.length === 0) return Promise.resolve()
    flushInFlight = api('sync', { method: 'POST', body: JSON.stringify({ ops }) })
      .then(() => {
        const sentIds = new Set(ops.map((o) => o.opId))
        localStorage.setItem('asit-q', JSON.stringify(qGet().filter((o) => !sentIds.has(o.opId))))
        toast(`Synced ${ops.length} offline change${ops.length === 1 ? '' : 's'} ✓`)
      })
      .finally(() => { flushInFlight = null })
    return flushInFlight
  }

  // GET with cache fallback; also the reconnect point where the queue drains.
  async function apiCached(path) {
    try {
      await flushQueue()
      const data = await api(path)
      cacheSet(path, data)
      offlineSince = null
      return data
    } catch (err) {
      if (String(err.message).includes('unauthorized')) throw err
      const hit = cacheGet(path)
      if (!hit) throw err
      offlineSince = hit.at
      return hit.data
    }
  }

  // Mutation that survives being offline: try live, else queue + apply locally.
  async function mutate(op, live, applyToCache) {
    try {
      await live()
    } catch {
      qPush(op)
      offlineSince = offlineSince || Date.now()
    }
    if (applyToCache) applyToCache()
  }

  function offlineBanner() {
    if (!offlineSince) return ''
    const mins = Math.round((Date.now() - offlineSince) / 60000)
    return `<div class="card" style="border-color:var(--accent-dim)"><span class="dim">📴 PC unreachable — working from data saved ${mins < 2 ? 'just now' : mins < 90 ? mins + ' min ago' : Math.round(mins / 60) + 'h ago'}. Changes will sync when it's back.</span></div>`
  }

  // A failure the user can actually act on, instead of a blank tab.
  function errorCard(err) {
    main.innerHTML = `
      <div class="card q-card">
        <div style="font-size:1.6rem;margin-bottom:8px">📡</div>
        <div style="font-weight:600;margin-bottom:8px">Can't talk to your PC</div>
        <div class="dim" style="line-height:1.6;margin-bottom:12px">${esc(err.message)}</div>
        <div class="dim" style="line-height:1.7;margin-bottom:14px">
          Check: ① the Tailscale app on this phone shows <b>Connected</b> ·
          ② your PC is on and ASIT is open · ③ then retry.
        </div>
        <button class="btn" style="width:100%" id="retry">Retry</button>
      </div>`
    document.getElementById('retry').onclick = () => render()
  }

  // ---- connection indicator + live refresh over WebSocket
  let ws = null
  function connectWs() {
    try {
      ws = new WebSocket(
        (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?token=' + encodeURIComponent(token())
      )
      ws.onopen = () => { $('#conn').textContent = 'live'; $('#conn').className = 'conn ok' }
      ws.onmessage = (e) => {
        try {
          const m = JSON.parse(e.data)
          if (m.type === 'changed' && (tab === 'todos' || tab === 'review' || tab === 'agents' || tab === 'ask')) render()
        } catch { /* ignore */ }
      }
      ws.onclose = () => {
        $('#conn').textContent = navigator.onLine ? 'PC offline' : 'no network'
        $('#conn').className = 'conn off'
        setTimeout(connectWs, 4000)
      }
    } catch { setTimeout(connectWs, 4000) }
  }
  connectWs()

  // ---- push notifications (iOS: requires Add to Home Screen first)
  async function enablePush() {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return toast('Push not supported here')
      const perm = await Notification.requestPermission()
      if (perm !== 'granted') return toast('Notifications denied')
      const reg = await navigator.serviceWorker.ready
      const { key } = await api('push/key')
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key })
      await api('push/subscribe', { method: 'POST', body: JSON.stringify(sub) })
      localStorage.setItem('asit-push', '1')
      toast('Notifications on ✓')
      render()
    } catch (err) { toast('Push setup failed: ' + err.message) }
  }


  // ---- tabs
  let tab = 'todos'
  document.querySelectorAll('nav button').forEach((b) => {
    b.onclick = () => { tab = b.dataset.tab; render() }
  })

  // Whenever we're online, quietly refresh the saved review queue too — so a
  // later offline stretch (PC asleep, on the bus) still has cards to study.
  function prefetchReview() {
    if (offlineSince) return
    api('review').then((d) => cacheSet('review', d)).catch(() => {})
  }

  // ---- To-dos
  // To-do text with real, tappable links. Parsed from the RAW text (then
  // escaped piece by piece) so an & inside a URL survives into the href.
  // asit:// links point at files on the PC, so on the phone they stay plain
  // labels — there is nothing here to open.
  function todoHtml(raw) {
    const MD = /\[([^\]]+)\]\((asit:\/\/[^)\s]+|https?:\/\/[^)\s]+)\)/g
    const BARE = /(https?:\/\/[^\s<>"')\]]+)/g
    const link = (text, href) =>
      href.startsWith('asit:')
        ? esc(text)
        : `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" class="tlink">${esc(text)}</a>`
    const linkifyPlain = (text) => {
      let out = ''
      let cursor = 0
      for (const m of text.matchAll(BARE)) {
        out += esc(text.slice(cursor, m.index))
        out += link(m[1], m[1])
        cursor = m.index + m[0].length
      }
      return out + esc(text.slice(cursor))
    }
    let html = ''
    let last = 0
    for (const m of raw.matchAll(MD)) {
      html += linkifyPlain(raw.slice(last, m.index))
      html += link(m[1], m[2])
      last = m.index + m[0].length
    }
    return html + linkifyPlain(raw.slice(last))
  }

  async function renderTodos() {
    const state = await apiCached('state')
    prefetchReview()
    const todos = state.todos
    const open = todos.filter((t) => !t.done)
    main.innerHTML = `
      ${offlineBanner()}
      <h2>To-dos</h2>
      <div class="card row">
        <input type="text" id="todo-in" placeholder="Add a to-do…" class="grow" />
        <button class="btn btn-sm" id="todo-add">Add</button>
      </div>
      <div id="todo-list"></div>
      ${localStorage.getItem('asit-push') ? '' : `
        <div class="card row"><span class="grow dim">Get pinged when watches fire and questions finish</span>
        <button class="btn btn-sm btn-ghost" id="push-on">🔔 Enable</button></div>`}
      ${open.length === 0 ? '<p class="empty">Nothing to do ✨</p>' : ''}`
    const list = $('#todo-list')
    for (const t of open) {
      const row = document.createElement('div')
      row.className = 'card row'
      row.innerHTML = `<button class="check"></button>
        <span class="grow">${todoHtml(t.text)}</span>
        ${t.dueDate ? `<span class="badge ${new Date(t.dueDate) < new Date() ? 'badge-danger' : ''}">${esc(t.dueDate.slice(5))}</span>` : ''}`
      row.querySelector('.check').onclick = () => {
        row.querySelector('.grow').classList.add('strike')
        mutate(
          { t: 'tododone', id: t.id, done: true },
          () => api('todos/' + t.id + '/done', { method: 'POST', body: JSON.stringify({ done: true }) }),
          () => { t.done = true; cacheSet('state', state) }
        )
      }
      list.appendChild(row)
    }
    $('#todo-add').onclick = async () => {
      const v = $('#todo-in').value.trim()
      if (!v) return
      await mutate(
        { t: 'todoadd', text: v },
        () => api('todos', { method: 'POST', body: JSON.stringify({ text: v }) }),
        () => { todos.unshift({ id: 'local-' + Date.now(), text: v, done: false, dueDate: null }); cacheSet('state', state) }
      )
      render()
    }
    const pushBtn = $('#push-on')
    if (pushBtn) pushBtn.onclick = enablePush
  }

  // ---- Review (SM-2 self-grade; multiple choice tap-to-answer)
  let queue = []
  async function renderReview() {
    if (queue.length === 0) {
      const reviewData = await apiCached('review')
      queue = reviewData.due
    }
    if (queue.length === 0) {
      main.innerHTML = offlineBanner() + '<h2>Review</h2><p class="empty">No questions due.<br/>Come back later 🧠</p>'
      return
    }
    const q = queue[0]
    main.innerHTML = `
      ${offlineBanner()}
      <h2>Review · ${queue.length} due</h2>
      <div class="card q-card">
        <div class="q-task">${esc(q.taskTitle)}</div>
        <div class="q-text">${esc(q.question)}</div>
        <div id="q-body"></div>
      </div>`
    const body = $('#q-body')
    const grades = () => {
      const g = document.createElement('div')
      g.className = 'grades'
      ;[['Again', 0, 'g0'], ['Hard', 1, 'g1'], ['Good', 2, 'g2'], ['Easy', 3, 'g3']].forEach(([label, grade, cls]) => {
        const b = document.createElement('button')
        b.className = 'btn ' + cls
        b.textContent = label
        b.onclick = async () => {
          queue.shift()
          await mutate(
            { t: 'review', id: q.id, grade },
            () => api('review/' + q.id, { method: 'POST', body: JSON.stringify({ grade }) }),
            () => {
              // Graded cards leave the phone's saved queue too, so an offline
              // session never shows them twice.
              const hit = cacheGet('review')
              if (hit) cacheSet('review', { due: (hit.data.due || []).filter((x) => x.id !== q.id) })
            }
          )
          render()
        }
        g.appendChild(b)
      })
      return g
    }
    if (q.choices && q.choices.length > 0) {
      q.choices.forEach((choice, i) => {
        const b = document.createElement('button')
        b.className = 'choice'
        b.textContent = choice
        b.onclick = () => {
          if (body.dataset.done) return
          body.dataset.done = '1'
          body.querySelectorAll('.choice').forEach((el, j) => {
            if (j === q.correctIndex) el.classList.add('correct')
            else if (j === i) el.classList.add('wrong')
          })
          body.appendChild(grades())
        }
        body.appendChild(b)
      })
    } else {
      const reveal = document.createElement('button')
      reveal.className = 'btn'
      reveal.style.width = '100%'
      reveal.textContent = 'Show answer'
      reveal.onclick = () => {
        const a = document.createElement('div')
        a.className = 'q-answer'
        a.textContent = q.answer
        reveal.replaceWith(a)
        body.appendChild(grades())
      }
      body.appendChild(reveal)
    }
  }

  // ---- Capture (goes into the scratchpad notes; "to-do:" lines auto-capture)
  // ---- Agents: what the PC is working on right now, live over the socket.
  // Runs in the background on the desktop, so this is the one view that
  // answers "is it still going?" without walking to the computer.
  function agentIcon(kind) {
    return kind === 'jarvis' ? '🤖' : kind === 'chat' ? '💬' : kind === 'questions' ? '🧠'
      : kind === 'watch' ? '👁' : '⚡'
  }

  function since(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000))
    if (s < 60) return s + 's'
    const m = Math.floor(s / 60)
    return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm'
  }

  async function renderAgents() {
    const state = await apiCached('state')
    if (offlineSince) {
      main.innerHTML = `${offlineBanner()}
        <h2>Agents</h2>
        <p class="empty">Agent activity is live-only — it can't be shown while your PC is
        unreachable, and what was running before may have finished.<br><br>
        Your to-dos, review cards and capture still work offline.</p>`
      return
    }
    const items = state.activity || []
    const running = items.filter((i) => !i.done)
    const finished = items.filter((i) => i.done)
    main.innerHTML = `
      ${offlineBanner()}
      <h2>Agents</h2>
      ${running.length === 0 ? '<p class="empty">Nothing running right now ✨</p>' : ''}
      ${running.map((i) => `
        <div class="card">
          <div class="row">
            <span class="grow"><b>${agentIcon(i.kind)} ${esc(i.label)}</b></span>
            <span class="badge">${since(i.startedAt)}</span>
          </div>
          <div class="dim" style="margin-top:4px;font-size:13px">${esc(i.detail || 'Working…')}</div>
        </div>`).join('')}
      ${finished.length ? `<h2 style="margin-top:18px">Recently finished</h2>` : ''}
      ${finished.map((i) => `
        <div class="card">
          <div class="row">
            <span class="grow">✓ ${esc(i.label)}</span>
            <span class="dim" style="font-size:12px">${i.finishedAt ? since(i.finishedAt) + ' ago' : ''}</span>
          </div>
        </div>`).join('')}`
  }

  function renderCapture() {
    main.innerHTML = `
      <h2>Capture</h2>
      <div class="card">
        <textarea id="cap" placeholder="Jot something… start a line with to-do: to make it a task"></textarea>
        <div class="row" style="margin-top:10px">
          <span class="grow dim">Lands in your scratchpad notes</span>
          <button class="btn btn-sm" id="cap-send">Save</button>
        </div>
      </div>`
    $('#cap-send').onclick = async () => {
      const v = $('#cap').value.trim()
      if (!v) return
      await mutate(
        { t: 'capture', text: v },
        () => api('capture', { method: 'POST', body: JSON.stringify({ text: v }) }),
        null
      )
      $('#cap').value = ''
      toast(offlineSince ? 'Saved on phone — will sync to PC ✓' : 'Saved to scratchpad ✓')
    }
  }

  // ---- Ask: ⚡ quick lookup (read-only, fast) or 🤖 Jarvis (acts on the app)
  const askLog = []
  let askMode = localStorage.getItem('asit-askmode') || 'quick'
  // ---- Ask: a real conversation with the agent, not a one-shot box.
  // The turn runs on the PC; this view watches it live over the socket and
  // can send follow-ups into the SAME session the desktop panel uses.
  async function renderAsk() {
    if (offlineSince) {
      main.innerHTML = `${offlineBanner()}
        <h2>Ask</h2>
        <p class="empty">Asking needs your PC — that's where the assistant runs.<br><br>
        Use <b>Capture</b> to jot it down now; it syncs the moment your PC is back.</p>`
      return
    }

    let data = { live: null, busy: false, history: [] }
    if (askMode === 'jarvis') {
      try { data = await api('jarvis') } catch { /* show the shell anyway */ }
    }
    const live = data.live
    const busy = !!data.busy

    const turns = []
    // Oldest first so the newest sits at the bottom, like any chat.
    for (const h of (data.history || []).slice().reverse()) {
      if (live && h.prompt === live.prompt && !live.running) continue // avoid dupe
      turns.push({ q: h.prompt, a: h.reply, busy: false, status: null })
    }
    if (live) turns.push({ q: live.prompt, a: live.reply, busy: live.running, status: live.status, error: live.error })
    for (const x of askLog) turns.push(x) // quick-mode replies live only here

    main.innerHTML = `
      <h2>Ask</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="btn btn-sm ${askMode === 'quick' ? '' : 'btn-ghost'}" id="mode-quick">Quick</button>
        <button class="btn btn-sm ${askMode === 'jarvis' ? '' : 'btn-ghost'}" id="mode-jarvis">Agent</button>
        ${busy ? '<button class="btn btn-sm btn-ghost" id="ask-stop">◼ Stop</button>' : ''}
      </div>
      <div id="ask-log">${turns.map((x) => `
        <div class="card">
          <div class="chat-q">${esc(x.q)}</div>
          ${x.status && x.busy ? `<div class="dim" style="margin:4px 0">${esc(x.status)}</div>` : ''}
          <div class="chat-a">${esc(x.a || '')}${x.busy ? ' <span class="spin"></span>' : ''}</div>
          ${x.error ? `<div class="dim" style="color:var(--danger)">${esc(x.error)}</div>` : ''}
        </div>`).join('')}</div>
      <div class="card row">
        <input type="text" id="ask-in" placeholder="${askMode === 'jarvis' ? (busy ? 'Queue a follow-up…' : 'Tell the agent what to do…') : 'Ask anything… ( ?g search · ?otp )'}" class="grow" />
        <button class="btn btn-sm" id="ask-go">➤</button>
      </div>`

    $('#mode-quick').onclick = () => { askMode = 'quick'; localStorage.setItem('asit-askmode', askMode); render() }
    $('#mode-jarvis').onclick = () => { askMode = 'jarvis'; localStorage.setItem('asit-askmode', askMode); render() }
    const stop = $('#ask-stop')
    if (stop) stop.onclick = async () => { try { await api('jarvis/cancel', { method: 'POST' }) } catch {} ; render() }

    const log = $('#ask-log')
    if (log) log.scrollTop = log.scrollHeight
    main.scrollTop = main.scrollHeight

    const go = async () => {
      const v = $('#ask-in').value.trim()
      if (!v) return
      $('#ask-in').value = ''
      if (askMode === 'jarvis') {
        try {
          const r = await api('assistant', { method: 'POST', body: JSON.stringify({ prompt: v, mode: 'jarvis' }) })
          if (!r.started) toast(r.reason || 'Busy')
        } catch (err) { toast('Failed: ' + err.message) }
        render() // live state takes over from here
        return
      }
      const entry = { q: v, a: '', busy: true }
      askLog.push(entry)
      renderAsk()
      try {
        const { reply } = await api('assistant', { method: 'POST', body: JSON.stringify({ prompt: v, mode: 'quick' }) })
        entry.a = reply
      } catch (err) { entry.a = 'Failed: ' + err.message }
      entry.busy = false
      if (tab === 'ask') renderAsk()
    }
    $('#ask-go').onclick = go
    $('#ask-in').onkeydown = (e) => { if (e.key === 'Enter') go() }
  }

  function render() {
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab))
    if (tab === 'todos') renderTodos().catch(errorCard)
    else if (tab === 'agents') renderAgents().catch(errorCard)
    else if (tab === 'review') renderReview().catch(errorCard)
    else if (tab === 'capture') renderCapture()
    else renderAsk().catch(errorCard)
  }
  render()

  // Elapsed times on the Agents tab must keep counting even when nothing
  // changes on the PC (a long job emits no events while it thinks).
  setInterval(() => { if (tab === 'agents') renderAgents().catch(() => {}) }, 5000)

  // Coming back to the app (or regaining network) should self-heal.
  window.addEventListener('focus', () => { if (tab === 'todos' || tab === 'review' || tab === 'agents') render() })
  window.addEventListener('online', () => render())
})()
</script>
</body>
</html>
