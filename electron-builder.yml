appId: com.vedansh.asit
afterPack: scripts/adhoc-sign.cjs
productName: ASIT
directories:
  output: dist
files:
  - out/**
  - package.json
  - resources/companion/**
  # pdf-parse ships 34MB of test PDFs and four bundled pdf.js versions;
  # only v1.10.100 (its default) is ever loaded.
  - '!node_modules/pdf-parse/test/**'
  - '!node_modules/pdf-parse/lib/pdf.js/v1.9.426/**'
  - '!node_modules/pdf-parse/lib/pdf.js/v1.10.88/**'
  - '!node_modules/pdf-parse/lib/pdf.js/v2.0.550/**'
asarUnpack:
  - node_modules/better-sqlite3/**
  # Per-platform native payloads. npm installs only the ones matching the
  # build host, so the globs that don't apply simply match nothing.
  - node_modules/sherpa-onnx-darwin-x64/**
  - node_modules/sherpa-onnx-darwin-arm64/**
  - node_modules/@lydell/node-pty-darwin-x64/**
  - node_modules/@lydell/node-pty-darwin-arm64/**
  # Native speech stack: the .node addon + its DLLs must live on the real
  # filesystem for the loader to find them.
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-win-x64/**
  # Terminal panes: the pty addon spawns conpty.dll/winpty-agent.exe as real
  # processes, so they cannot live inside the asar.
  - node_modules/@lydell/node-pty/**
  - node_modules/@lydell/node-pty-win32-x64/**
  # koffi loads its own .node from disk (window embedding) — it cannot be
  # read out of the asar.
  - node_modules/koffi/**
win:
  target:
    - nsis
  # Generated from the app's own logo mark by `npm run icon`. Without this
  # electron-builder shipped the default Electron icon, so the installer, the
  # taskbar and Alt-Tab all showed someone else's logo.
  icon: build/icon.ico
  # Skips the winCodeSign toolchain, whose extraction needs symlink privileges
  # (fails without Windows Developer Mode). We don't sign the exe anyway.
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: ASIT
  createDesktopShortcut: true
  # One double-click, no wizard, and it opens when it's done.
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  # Apple silicon only. npm installs only the host's native payloads
  # (sherpa-onnx, node-pty), so an x64 build made on an arm64 Mac shipped
  # without them — voice and the terminal were dead on Intel. Add x64 back
  # only from an x64 build host.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: build/icon.png
  category: public.app-category.productivity
  # The app asks for the mic (dictation) and reaches the network. macOS kills
  # apps that use these without declaring why.
  extendInfo:
    NSMicrophoneUsageDescription: ASIT uses your microphone for local dictation and voice commands. Audio never leaves your machine.
    NSAppleEventsUsageDescription: ASIT opens Terminal to sign you in to the Claude CLI.
  # Ad-hoc signed (scripts/adhoc-sign.cjs), not Developer ID: Apple silicon refuses to run code
  # with NO signature, and an unsigned bundle whose Info.plist was edited
  # reads as "damaged". Ad-hoc fixes that; Gatekeeper still asks on first
  # open (right-click → Open) because there is no paid identity/notarization.
  # identity null skips electron-builder's keychain signing; afterPack signs.
  identity: null
dmg:
  writeUpdateInfo: false

# Where the app looks for updates, and where `npm run release` publishes them.
publish:
  provider: github
  owner: v1m08
  repo: ASIT
  # electron-builder defaults to a DRAFT release. A draft is invisible to the
  # download link, to anyone browsing Releases, and to electron-updater — so
  # the build would succeed and nothing would actually ship.
  releaseType: release
