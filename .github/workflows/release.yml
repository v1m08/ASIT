name: Release

# Push a version tag and this builds installers for Windows and macOS and
# attaches them to a GitHub Release. That release is also the update feed the
# app itself polls, so shipping a fix and delivering it are the same action:
#
#   npm version patch && git push --follow-tags
#
# Manual runs are allowed too, for testing the pipeline without cutting a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload the installers

jobs:
  build:
    strategy:
      # One platform failing must not delete the other's artifacts from a
      # half-published release.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            build: npm run release
          - os: macos-latest
            name: mac
            build: npm run release:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall that rebuilds better-sqlite3 and friends
      # against Electron's ABI — the packaged app is unusable without it.
      # On failure, surface the real npm error: the run logs need repo-admin
      # rights to read through the API, so without this a broken install is
      # just "npm ci: failure" with no cause. --foreground-scripts makes the
      # postinstall (native rebuild) output inline instead of being swallowed.
      # Exactly as the last green build (1.0.14) ran it. --foreground-scripts
      # broke the Windows runner; the failure diagnostics below still fire.
      - run: npm ci
      # Surface the failure as ANNOTATIONS. Run logs, step summaries and
      # artifacts all need repo-admin auth to read through the API; the
      # `::error::` workflow command becomes a check annotation, which does
      # not. Without this an install failure is just "exit code 1".
      - name: Report install failure
        if: failure()
        shell: bash
        run: |
          echo "::error::install failed on ${{ matrix.name }} — node $(node -v), npm $(npm -v)"
          for f in ~/.npm/_logs/*.log; do
            [ -f "$f" ] || continue
            grep -iE "npm error|npm ERR|gyp ERR|error:" "$f" | tail -12 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          done

      - run: npm run typecheck

      # The icon is generated, not committed, so it needs a display to render
      # into. Both runners have one, but a missing icon is not worth failing a
      # release over — electron-builder falls back to the default.
      - run: npm run icon
        continue-on-error: true

      # The suite that can run without a logged-in Claude CLI. This is the
      # only real verification macOS gets — nobody here has a Mac to click
      # through, so at minimum the app must build, boot, open a window, and
      # pass its own invariants on that platform.
      - name: Smoke tests
        run: npm run smoke
        env:
          ASIT_NO_UPDATE: '1'

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build }}

      - name: Keep the installers even if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASIT-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn
