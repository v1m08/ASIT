name: Release

# Push a version tag and this builds the Windows installer and attaches it to
# a GitHub Release. That release is also the update feed the app itself polls,
# so shipping a fix and delivering it are the same action:
#
#   npm version patch && git push --follow-tags
#
# Manual runs are allowed too, for testing the pipeline without cutting a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall that rebuilds better-sqlite3 and friends
      # against Electron's ABI — the packaged app is unusable without it.
      - run: npm ci

      - run: npm run typecheck

      # The icon is generated, not committed, so it needs a display to render
      # into. Windows runners have one, but a missing icon is not worth
      # failing a release over — electron-builder falls back to the default.
      - run: npm run icon
        continue-on-error: true

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Keep the installer even if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASIT-installer
          path: dist/*.exe
          if-no-files-found: warn
